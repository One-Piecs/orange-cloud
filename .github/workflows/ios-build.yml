name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      export_method:
        description: 'Export method: development (AltStore/sideload) | ad-hoc | app-store-connect'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - ad-hoc
          - app-store-connect
  push:
    branches: [main]

concurrency:
  group: build-ios-ipa
  cancel-in-progress: true

jobs:
  build:
    name: Build and export IPA
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # AltStore sideloading: AltStore/AltServer re-signs the IPA with your personal
      # Apple Development certificate at install time, so the CI produces a
      # development-signed device IPA that AltServer can install on your iPhone.
      #
      # Signing is done via automatic signing + an App Store Connect API key, so no
      # certificates or provisioning profiles need to live in the repo. This path
      # requires a PAID Apple Developer Program account (free personal IDs cannot
      # create App Store Connect API keys and are subject to a 3-app/App-ID limit).
      #
      # Required secrets (repo > Settings > Secrets and variables > Actions):
      #   APP_STORE_CONNECT_API_KEY       base64 of the .p8 key, e.g. `base64 AuthKey_XXX.p8`
      #   APP_STORE_CONNECT_API_KEY_ID    10-char key id
      #   APP_STORE_CONNECT_ISSUER_ID     issuer id
      #   APPLE_TEAM_ID                   team id (project uses 6G78MMY657)
      #
      # To sideload on the target iPhone, that device UDID must be registered in the
      # developer portal so the automatic development profile includes it.
      - name: Check signing secrets
        env:
          API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$API_KEY" ] || [ -z "$KEY_ID" ] || [ -z "$ISSUER" ] || [ -z "$TEAM" ]; then
            echo "::error::Missing iOS signing secrets. Add to repo Settings > Secrets and variables > Actions: APP_STORE_CONNECT_API_KEY, APP_STORE_CONNECT_API_KEY_ID, APP_STORE_CONNECT_ISSUER_ID, APPLE_TEAM_ID"
            exit 1
          fi

      - name: Prepare App Store Connect API key
        env:
          API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          echo "$API_KEY" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project "apps/ios/Orange Cloud/Orange Cloud.xcodeproj" \
            -scheme "Orange Cloud" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/OrangeCloud.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            CODE_SIGN_STYLE=Automatic

      - name: Export IPA
        run: |
          METHOD="${{ github.event.inputs.export_method || 'ad-hoc' }}"
          cat > "$RUNNER_TEMP/exportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>${METHOD}</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>compileBitcode</key>
            <false/>
            <key>stripSwiftSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/OrangeCloud.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/exportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: OrangeCloud-${{ github.sha }}
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error
